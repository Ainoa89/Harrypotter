
<!DOCTYPE html>

    <header>

    <main>
        <br>
        <form>
            <label for="nom">Estimat senyor/a, l'informem de que ha sigut acceptat a l'escola de màgia de Hogwarts:</label>
            <br>
            <input type="text" id="nom">
            <br><br>
            <label for="correu">Any que començarà a cursar:</label>
            <br>
            <input type="email" id="correu">
            <br><br>
            <label for="msg">Informació personal adicional :</label>
            <br>
            <textarea id="msg" rows="4" cols="30"></textarea>
            <br><br>
            <label for="nombre">Accepte anar a l'escola</label>
            <input type="checkbox" id="nombre">
            <br><br>
            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>Pàgina creada per a l'assignatura d'Informàtica — 2026</p>
    </footer>
